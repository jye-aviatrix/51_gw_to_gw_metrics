name: Export connection metrics

# Runs Export-AviatrixCopilotConnectionMetric against CoPilot and saves the CSV as a build artifact.
#
# Setup (Settings > Secrets and variables > Actions):
#   Secrets:   COPILOT_USER, COPILOT_PASSWORD
#   Variables: COPILOT_HOST        CoPilot IP or FQDN
#
# The runner must be able to reach CoPilot over HTTPS. GitHub-hosted runners come from public IP
# ranges, so CoPilot must be reachable from the internet or the job must run on a self-hosted runner
# (change runs-on).

on:
  workflow_dispatch:
    inputs:
      transit_gateways:
        description: Comma-separated primary transit gateway names or transit gateway group names
        type: string
        default: transit1-gw,transit2-gw,transit3-gw,transit4
      time_range:
        description: Time range (Custom uses start and end below)
        type: choice
        options: [Last15Min, Last30Min, Last60Min, Last24Hours, Last7Days, LastMonth, Custom]
        default: Last15Min
      start:
        description: Custom start, UTC (for example 2026-11-18T13:00:00Z). Only used when time_range is Custom
        type: string
        required: false
      end:
        description: Custom end, UTC (for example 2026-11-18T17:30:00Z). Only used when time_range is Custom
        type: string
        required: false
      metric:
        description: CoPilot metric
        type: string
        default: rate_total
      agg_method:
        description: How each tunnel's points over the time range are reduced to one value
        type: choice
        options: [avg, min, max, sum]
        default: avg
      connection_type:
        description: Which connections to export
        type: choice
        options: [All, SpokeTransitAttachment, TransitPeering]
        default: All
  # Uncomment for a recurring export; each run queries CoPilot (about 150 requests for the lab).
  # Scheduled runs have no inputs, so they use the defaults below (the four lab transits, Last15Min, rate_total, avg).
  # schedule:
  #   - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: export-connection-metrics
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest   # PowerShell 7 is preinstalled
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Export connection metrics
        shell: pwsh
        env:
          COPILOT_USER: ${{ secrets.COPILOT_USER }}
          COPILOT_PASSWORD: ${{ secrets.COPILOT_PASSWORD }}
          COPILOT_HOST: ${{ vars.COPILOT_HOST }}
          TRANSIT_GATEWAYS: ${{ inputs.transit_gateways || 'transit1-gw,transit2-gw,transit3-gw,transit4' }}
          TIME_RANGE: ${{ inputs.time_range || 'Last15Min' }}
          CUSTOM_START: ${{ inputs.start }}
          CUSTOM_END: ${{ inputs.end }}
          METRIC: ${{ inputs.metric || 'rate_total' }}
          AGG_METHOD: ${{ inputs.agg_method || 'avg' }}
          CONNECTION_TYPE: ${{ inputs.connection_type || 'All' }}
        run: |
          # Fail fast: without these the module would try to prompt, which a CI job cannot answer.
          if (-not $env:COPILOT_USER -or -not $env:COPILOT_PASSWORD) { throw 'Secrets COPILOT_USER and COPILOT_PASSWORD must be set.' }

          if ($env:TIME_RANGE -eq 'Custom' -and -not ($env:CUSTOM_START -and $env:CUSTOM_END)) { throw 'time_range Custom needs both start and end.' }

          Import-Module ./powershell/AviatrixCopilot/AviatrixCopilot.psd1 -Force

          # -Start/-End are only used by -TimeRange Custom; the module ignores them for named ranges.
          $custom = if ($env:TIME_RANGE -eq 'Custom') { @{ Start = [datetime]$env:CUSTOM_START; End = [datetime]$env:CUSTOM_END } } else { @{} }

          $rows = Export-AviatrixCopilotConnectionMetric -ComputerName $env:COPILOT_HOST -SkipCertificateCheck `
              -TransitGateway ($env:TRANSIT_GATEWAYS.Trim() -split '\s*,\s*') -Metric $env:METRIC `
              -AggMethod $env:AGG_METHOD -ConnectionType $env:CONNECTION_TYPE `
              -TimeRange $env:TIME_RANGE @custom -Path "$env:RUNNER_TEMP/connection-metrics.csv" -PassThru

          # One row per tunnel; combining tunnels depends on the metric, so the job summary only counts them.
          "### Connection metrics: $env:METRIC ($env:AGG_METHOD, $env:TIME_RANGE)`n`n$(@($rows).Count) tunnel rows exported; the CSV is attached as an artifact." | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: connection-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/connection-metrics.csv
          if-no-files-found: error
          retention-days: 30
